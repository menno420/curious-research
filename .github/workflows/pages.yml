# Publishes the read-only website to GitHub Pages.
#
# The site source is `site/` — plain HTML/CSS, no framework and no build
# step, so any future session can edit it like any other file. The only
# thing this workflow does beyond copying is drop `guides/` in next to
# it, because the shelf page links straight at each guide's own
# `index.html` and those live in `guides/`, not in `site/`.
#
# Result on the live site:
#   /                            -> site/index.html   (the Dutch shelf)
#   /guides/<naam>/index.html    -> the animated guide, unchanged
#
# ONE-TIME SETUP by the owner, or nothing publishes:
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
# The site then lands at https://menno420.github.io/curious-research/
#
# This really is a human click, measured rather than assumed. Trying
# actions/configure-pages@v5 with `enablement: true` failed with
# "Create Pages site failed. Error: Resource not accessible by
# integration" (run 31161900393): the workflow's GITHUB_TOKEN can DEPLOY
# to an existing Pages site but cannot CREATE one, even with
# `pages: write`. Site creation needs a token with repo-admin rights,
# which a workflow token is not. Do not re-add `enablement` — it turns a
# clean "not enabled yet" deploy failure into a hard build failure.
name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "guides/**"
      - ".github/workflows/pages.yml"
  # SAFETY NET -- do not remove without reading this.
  #
  # The push trigger above does NOT fire for PRs that land via GitHub's
  # auto-merge when auto-merge was armed with the default GITHUB_TOKEN.
  # GitHub suppresses workflow runs for events triggered by that token, to
  # stop workflows triggering themselves forever. Measured 2026-08-07: five
  # PRs merged in a row, zero pages runs, a live site stale by half a day
  # while every merge looked successful.
  #
  # So this schedule guarantees the site catches up on its own. Publishing
  # is idempotent and the whole run takes seconds.
  #
  # To make it instant again: add a repo secret named ROUTINE_PAT holding a
  # personal access token with Contents + Pull requests write.
  # auto-merge-enabler.yml already prefers it over GITHUB_TOKEN, and a merge
  # performed by a real user's token DOES trigger the push above.
  schedule:
    - cron: "17 */2 * * *"   # every two hours, off the hour to avoid the rush
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; just queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r guides _site/guides
          # Markdown is for reading on GitHub, where it renders. Served
          # raw over Pages it just downloads, so it stays out of the
          # artifact — the guide.md companions and site/README.md alike.
          find _site -name '*.md' -delete
          echo "published pages:"
          find _site -name 'index.html' | sort
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
