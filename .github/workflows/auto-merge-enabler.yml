# Auto-merge enabler. Hand-owned — edit it freely; nothing regenerates
# it any more.
#
# Arms GitHub-native auto-merge on `claude/*` PRs at open, so a PR
# merges itself the moment the required check goes green.
# INERT until two one-time repo settings exist (owner UI):
#   1. Settings → General → Pull Requests → "Allow auto-merge" = ON.
#   2. A ruleset on the default branch REQUIRING the 'substrate-gate'
#      status check.
# With NO required check, arming merges a PR INSTANTLY — the
# refuse-to-arm guard below counts required contexts and refuses on
# zero rather than inverting the gate.
#
# CARVE-OUT: label `do-not-automerge` = never armed
# (job-level check + a fresh API re-read to defeat the stale-payload
# label race). The label is advisory routing; the required check
# going red is the enforcement.
name: auto-merge-enabler
on:
  pull_request:
    # `synchronize` (every push to the PR head) re-arms: arming is
    # idempotent and never merges anything itself — the merge stays
    # gated by the required check. This narrows the green-behind
    # stall: a fix-push or `git merge origin/<base>` re-arms on the
    # up-to-date head.
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: auto-merge-enabler-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (startsWith(github.head_ref, 'claude/')) &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to arm unless the base branch requires status CONTEXTS
        id: rules
        env:
          GH_TOKEN: ${{ secrets.ROUTINE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Count required check CONTEXTS, not rules: a
          # required_status_checks RULE with an empty context list
          # still lets an armed PR merge with nothing to wait for.
          contexts="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/${{ github.base_ref }}" \
            --jq '[.[] | select(.type == "required_status_checks")
                   | .parameters.required_status_checks // [] | .[].context]')"
          count="$(printf '%s' "$contexts" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          echo "required contexts ($count): $contexts"
          echo "required=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "::warning::the base branch requires no status-check CONTEXTS — arming would merge instantly. Refusing to arm; make 'substrate-gate' a required check first (Settings -> Rules -> Rulesets)."
          fi
      - name: Re-check the do-not-automerge label FRESH (stale-payload race guard)
        id: label
        if: steps.rules.outputs.required != '0'
        env:
          GH_TOKEN: ${{ secrets.ROUTINE_PAT || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The event payload snapshots labels at PR-open time; an
          # MCP-created PR gets its label in a SECOND call right
          # after create. Wait a grace beat, then re-read labels
          # from the API and refuse to arm if the label is present
          # NOW (the kit #22 incident class).
          sleep 15
          labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name] | join(",")')"
          echo "labels on re-read: $labels"
          case ",$labels," in
            *,do-not-automerge,*)
              echo "do-not-automerge present on re-read — refusing to arm."
              echo "skip=1" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "skip=0" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Do NOT arm a PR that publishes the site (it would land unpublished)
        id: publish
        if: steps.rules.outputs.required != '0' && steps.label.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.ROUTINE_PAT || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # MEASURED 2026-08-07. GitHub suppresses workflow runs for events
          # triggered by GITHUB_TOKEN. With no ROUTINE_PAT set, native
          # auto-merge lands the PR as GITHUB_TOKEN, so pages.yml's `push`
          # trigger never fires and the live site silently keeps serving the
          # previous build — green checks, no error, wrong site. PR #68 did
          # exactly that: site/index.html changed, zero pages runs, and the
          # new guide 404'd live.
          #
          # The SAME merge performed with a user-attributed token DOES fire
          # pages — verified on PR #72, a `push` run within 20 seconds. So for
          # any PR touching what gets published we refuse to arm, and a
          # session merges it via the API instead. The step below already
          # prefers a PAT "so the eventual merge attributes to a real user";
          # this makes that preference load-bearing instead of advisory.
          #
          # Remove this step if a ROUTINE_PAT is ever added, or if the site
          # moves off GitHub Pages.
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qE '^(site|guides)/'; then
            echo "::notice::PR #$PR touches site/ or guides/ — NOT arming auto-merge. Merge it with a user-attributed token so pages.yml fires, then check the live URL actually changed."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "no publishing paths touched — arming normally."
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable native auto-merge (squash)
        if: steps.rules.outputs.required != '0' && steps.label.outputs.skip == '0' && steps.publish.outputs.skip == '0'
        env:
          # Prefer a PAT so the eventual merge attributes to a real
          # user; GITHUB_TOKEN is the fallback.
          GH_TOKEN: ${{ secrets.ROUTINE_PAT || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"; then
            echo "Auto-merge enabled for PR #$PR — it merges when 'substrate-gate' is green."
          else
            echo "::warning::Could not enable auto-merge for PR #$PR. Confirm: (1) 'Allow auto-merge' is ON, (2) the base branch requires the 'substrate-gate' check, (3) the token has Pull requests + Contents write. If GitHub refuses the arm outright, merge the PR by hand once the check is green."
          fi
