# The repo's one CI check.
#
# The name of this workflow AND the job id below must stay exactly
# `substrate-gate`: a branch ruleset on `main` requires a status check
# with that context name. A required context that never reports leaves
# every PR pending forever, so the name is load-bearing even though the
# old substrate-kit machinery it was built for is gone.
#
# What it actually does now: walks every Markdown and HTML file in the
# repo and fails if a relative link points at a file that does not
# exist. That is the failure this repo is genuinely prone to — guides
# link to each other and to docs/, and a moved or deleted file turns
# into a dead link the maker clicks on and hits a 404.
name: substrate-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  substrate-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: relative links resolve
        run: python3 .github/scripts/check_links.py
