# The repo's one CI check.
#
# The name of this workflow AND the job id below must stay exactly
# `substrate-gate`: a branch ruleset on `main` requires a status check
# with that context name. A required context that never reports leaves
# every PR pending forever, so the name is load-bearing even though the
# old substrate-kit machinery it was built for is gone.
#
# What it actually does now: checks relative Markdown/HTML links and renders
# every maintained OpenSCAD model (including meaningful parameter branches) to
# a manifold STL. Broken navigation and silently invalid printable geometry are
# the two repository failures this gate is designed to stop.
name: substrate-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  substrate-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: relative links resolve
        run: python3 .github/scripts/check_links.py
      - name: install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad
      - name: OpenSCAD models render as manifold meshes
        run: bash .github/scripts/check_openscad.sh
